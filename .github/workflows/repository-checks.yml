name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-policy:
    name: Policy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tooling
        run: python -m compileall -q tools
      - name: Parse PowerShell collision diagnostic scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $scripts = @(
            'tools/windows/Invoke-CV3DCJP-CollisionV12Mesen.ps1',
            'tools/windows/Invoke-CV3DCJP-CollisionV11Native.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $script, $_.Message) }
              exit 1
            }
          }
      - name: Check tracked files and repository policy
        run: python tools/check_repository.py
      - name: Test repository checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  collision-native-smoke:
    name: Collision C11 (ROM-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run bounded native collision interface test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-function \
            -I src/collision \
            src/collision/Collision.c tests/test_collision_api.c \
            -o /tmp/cv3dcjp_collision_test
          /tmp/cv3dcjp_collision_test
      - name: Build guarded collision shadow boundary (no ROM)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-function \
            -I src/collision \
            src/collision/Collision.c src/collision/CollisionLive.c \
            tests/test_collision_live_no_rom.c \
            -o /tmp/cv3dcjp_collision_guard
          /tmp/cv3dcjp_collision_guard

  collision-v11-dispatch-abi:
    name: Collision v11 dispatch ABI against pinned NESRecomp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mstan/nesrecomp
          ref: 2b4fcdb98c9e702be3fb365cfc645003c50b5fc1
          path: upstream/nesrecomp
          persist-credentials: false
      - name: Compile read-only V11 callback against authentic upstream headers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-function \
            -I src/collision -I upstream/nesrecomp/runner/cyc \
            -I upstream/nesrecomp/runner/include \
            -c src/collision/CollisionDispatchV11.c \
            -o /tmp/cv3dcjp_collision_dispatch_v11.o
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-function \
            -I src/collision -c src/collision/CollisionLive.c \
            -o /tmp/cv3dcjp_collision_live_v11.o
          cc -std=c11 -Wall -Wextra -Wno-unused-function \
            -DCVIII_COLLISION_V11_SHADOW=1 \
            -I src/collision \
            -I upstream/nesrecomp/runner/cyc \
            -I upstream/nesrecomp/runner/include \
            -I legacy/rom-backed/JP/recomp/native/enhanced \
            -I legacy/rom-backed/JP/recomp/native/nesrecomp_modern \
            -c legacy/rom-backed/JP/recomp/native/nesrecomp_modern/cviii_modern_host.c \
            -o /tmp/cv3dcjp_collision_host_v11.o

      - name: Compile and link headless collision selector-unavailable gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -DCVIII_COLLISION_V11_SHADOW=1 \
            legacy/rom-backed/JP/recomp/native/nesrecomp_modern/cviii_selector_unavailable_collision_v11.c \
            tests/test_collision_v11_selector_unavailable.c \
            -o /tmp/cv3dcjp_collision_selector_gate
          /tmp/cv3dcjp_collision_selector_gate
          if nm -g /tmp/cv3dcjp_collision_selector_gate | grep -E 'cyc_cviii_selector_write_5h8[su]'; then
            echo "unexpected fabricated engine selector symbol"
            exit 1
          fi

      - name: Validate v11.2 capture verifier and ROM-free IRQ stack contracts
        run: |
          python3 -m py_compile tools/instrumentation/verify_fcde_sync_dmc_irq_v11.py
          python3 -m unittest discover -s tests -p 'test_collision_sync_dmc_irq_v11.py' -v

      - name: Validate v11.2 controller replay conversion contracts
        run: |
          python3 -m py_compile tools/instrumentation/collision_v11_make_native_input.py
          python3 -m unittest discover -s tests -p 'test_collision_v11_input_replay.py' -v
          python3 -m unittest discover -s tests -p 'test_collision_paired_dma_v11.py' -v

  collision-v12-mesen-source-gate:
    name: Collision v12 genuine MesenCE DMC source hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nesdev-org/MesenCE
          ref: 4b8a196e299b3de297b204fd1208d2981562c89b
          path: upstream/mesen
          persist-credentials: false
      - name: Patch exact pinned original DMA debugger source, no ROM
        run: |
          python3 tools/instrumentation/prepare_mesen_dmc_bus_v12.py --private-source upstream/mesen
          python3 - <<'PY'
          from pathlib import Path
          source = Path("upstream/mesen/Core/NES/Debugger/NesDebugger.cpp").read_text(encoding="utf-8-sig")
          assert source.count("cv3dcjp_v12_dma_bus(") == 3
          assert "MemoryOperationType::DmaRead" in source
          assert "MemoryOperationType::DmaWrite" in source
          assert "_cpu->IsDmcDma()" in source
          assert "CV3DCJP_MESEN_DMC_CSV" in source
          PY
