name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-policy:
    name: Policy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tooling
        run: python -m compileall -q tools
      - name: Check tracked files and repository policy
        run: python tools/check_repository.py
      - name: Test repository checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  collision-native-smoke:
    name: Collision C11 (ROM-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run bounded native collision interface test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-function \
            -I src/collision \
            src/collision/Collision.c tests/test_collision_api.c \
            -o /tmp/cv3dcjp_collision_test
          /tmp/cv3dcjp_collision_test
      - name: Build guarded collision shadow boundary (no ROM)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-function \
            -I src/collision \
            src/collision/Collision.c src/collision/CollisionLive.c \
            tests/test_collision_live_no_rom.c \
            -o /tmp/cv3dcjp_collision_guard
          /tmp/cv3dcjp_collision_guard
