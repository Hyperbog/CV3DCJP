name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-policy:
    name: Policy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tooling
        run: python -m compileall -q tools
      - name: Check tracked files and repository policy
        run: python tools/check_repository.py
      - name: Test repository checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
